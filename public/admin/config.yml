backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ==========================================
  # SKILLS & FOCUS AREAS COLLECTION
  # ==========================================
  - name: "services"
    label: "Skills & Focus Areas"
    label_singular: "Skill Area"
    folder: "src/content/services"
    create: true
    delete: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Skill / Focus Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", hint: "e.g. performance-marketing, google-ads, analytics-tracking, video-editing" }
      - { label: "Sort Order", name: "sortOrder", widget: "number", default: 1, value_type: "int" }
      - { label: "Category Pill", name: "tag", widget: "string", default: "Skill Area" }
      - { label: "Short Summary (Card Overview)", name: "shortDescription", widget: "text" }
      - { label: "Page Subtitle", name: "heroSubtitle", widget: "text", required: false }
      - { label: "Approach Section Heading", name: "thesisHeading", widget: "string", required: false }
      - { label: "Approach Section Description", name: "thesisDescription", widget: "text", required: false }
      - label: "Key Areas I Work On"
        name: "capabilities"
        widget: "list"
        required: false
        fields:
          - { label: "Skill / Focus Title", name: "title", widget: "string" }
          - { label: "Description", name: "desc", widget: "text" }
      - { label: "Process Section Heading", name: "methodologyHeading", widget: "string", required: false }
      - label: "Workflow Steps"
        name: "methodologySteps"
        widget: "list"
        required: false
        fields:
          - { label: "Step Number (e.g. 01)", name: "num", widget: "string" }
          - { label: "Step Title", name: "title", widget: "string" }
          - { label: "Step Description", name: "desc", widget: "text" }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seoDescription", widget: "text", required: false }
      - { label: "Detailed Overview (Markdown)", name: "body", widget: "markdown", required: false }

  # ==========================================
  # PORTFOLIO PROJECTS COLLECTION
  # ==========================================
  - name: "portfolio"
    label: "Portfolio Projects"
    label_singular: "Project"
    folder: "src/content/portfolio"
    create: true
    delete: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Project Type", name: "projectType", widget: "select", options: ["Professional Work", "Personal Project", "Collaborative Project"], default: "Personal Project" }
      - { label: "Organization / Context", name: "organization", widget: "string", required: false, hint: "e.g. SPT Hospitals, Coimbatore or Personal Project" }
      - { label: "My Role", name: "role", widget: "string", required: false, hint: "e.g. Digital Marketing & Visual Marketing Executive" }
      - { label: "Industry / Domain", name: "industry", widget: "string", required: false }
      - { label: "Category", name: "category", widget: "select", options: ["Performance Marketing", "Social Media", "Graphic Design", "Video Editing", "Website Projects"] }
      - { label: "Year", name: "year", widget: "string", default: "2026" }
      - { label: "Project Overview", name: "overview", widget: "text" }
      - { label: "Objective", name: "objective", widget: "text", required: false }
      - { label: "My Role & Contribution", name: "myContribution", widget: "text", required: false }
      - { label: "Execution", name: "execution", widget: "text", required: false }
      - { label: "Work / Deliverables List", name: "deliverables", widget: "list", required: false }
      - { label: "Outcomes / Takeaways", name: "outcomes", widget: "list", required: false, hint: "Only verified or factual project outcomes (or [Placeholder])" }
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      - { label: "Additional Gallery Images", name: "images", widget: "list", field: { label: "Image", name: "image", widget: "image" }, required: false }
      - { label: "Gradient Start Color", name: "gradientFrom", widget: "string", default: "#2a1a10" }
      - { label: "Gradient End Color", name: "gradientTo", widget: "string", default: "#0a0a0a" }
      - { label: "Draft Mode", name: "draft", widget: "boolean", default: false }
      - { label: "Sort Order", name: "sortOrder", widget: "number", default: 0, value_type: "int" }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seoDescription", widget: "text", required: false }
      - { label: "Project Write-up (Markdown)", name: "body", widget: "markdown" }

  # ==========================================
  # BLOG ARTICLES COLLECTION
  # ==========================================
  - name: "blog"
    label: "Blog & Notes"
    label_singular: "Article"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      - { label: "Author", name: "author", widget: "string", default: "Akash Thirumal" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Excerpt Summary", name: "excerpt", widget: "text", required: false }
      - { label: "Draft Mode", name: "draft", widget: "boolean", default: false }
      - { label: "Related Article Slugs", name: "relatedSlugs", widget: "list", required: false }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "seoDescription", widget: "text", required: false }
      - { label: "Article Content (Markdown)", name: "body", widget: "markdown" }

  # ==========================================
  # SITE SETTINGS & PORTFOLIO CONTENT (SINGLETONS)
  # ==========================================
  - name: "settings"
    label: "Portfolio Content & Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "site"
        label: "Personal Info, Contact & Analytics"
        file: "src/data/site.json"
        fields:
          - { label: "Your Name", name: "name", widget: "string" }
          - { label: "Professional Tagline", name: "tagline", widget: "string" }
          - { label: "Site Meta Description", name: "description", widget: "text" }
          - { label: "Production Canonical URL", name: "url", widget: "string" }
          - { label: "Default Social Share Image (OG Image)", name: "ogImage", widget: "image", required: false }
          - { label: "Contact Email", name: "email", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "WhatsApp Contact Number", name: "whatsapp", widget: "string" }
          - { label: "Location", name: "address", widget: "string" }
          - { label: "Google Tag Manager ID", name: "gtmId", widget: "string", hint: "Live container ID (e.g. GTM-XXXXXXX)" }
          - label: "Social Profiles"
            name: "social"
            widget: "object"
            fields:
              - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
              - { label: "Behance URL", name: "behance", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "YouTube URL", name: "youtube", widget: "string", required: false }

      - name: "home"
        label: "Home Page Copy, Experience & Tools"
        file: "src/data/home.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow Text", name: "eyebrow", widget: "string" }
              - { label: "Main Headline", name: "headline", widget: "string" }
              - { label: "Introduction Paragraph", name: "description", widget: "text" }
              - { label: "Primary Button Label", name: "ctaPrimaryLabel", widget: "string" }
              - { label: "Secondary Button Label", name: "ctaSecondaryLabel", widget: "string" }
          - label: "Hero Floating Showcase Cards"
            name: "heroCards"
            widget: "list"
            fields:
              - { label: "Card Identifier (fc1, fc2, fc3, fc4)", name: "id", widget: "string" }
              - { label: "Title / Label", name: "label", widget: "string" }
              - { label: "Parallax Depth (10-35)", name: "depth", widget: "number", value_type: "int" }
              - { label: "Card Image", name: "image", widget: "image" }
              - { label: "Alt Text Description", name: "alt", widget: "string", required: false }
          - label: "About Me Summary Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline Part 1", name: "headline", widget: "string" }
              - { label: "Headline Part 2 (Italic Light)", name: "lightHeadline", widget: "string" }
              - { label: "First Paragraph", name: "paragraph1", widget: "text" }
              - { label: "Second Paragraph", name: "paragraph2", widget: "text" }
              - { label: "Current Role Summary", name: "roleSummary", widget: "string" }
              - { label: "Focus Summary", name: "focusSummary", widget: "string" }
              - { label: "Career Goal Summary", name: "goalSummary", widget: "string" }
              - { label: "Portrait Caption", name: "portraitCaption", widget: "string" }
          - label: "Skills & Expertise Pillars"
            name: "skillGroups"
            widget: "list"
            fields:
              - { label: "Number (e.g. 01)", name: "num", widget: "string" }
              - { label: "Category Title", name: "title", widget: "string" }
              - { label: "Short Summary", name: "summary", widget: "text" }
              - { label: "Detail Page Link", name: "linkHref", widget: "string" }
              - { label: "Link Label", name: "linkLabel", widget: "string" }
              - { label: "Skills List", name: "items", widget: "list" }
          - label: "Experience Section (SPT Hospitals)"
            name: "experience"
            widget: "object"
            fields:
              - { label: "Section Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Section Headline", name: "headline", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Job Title", name: "roleTitle", widget: "string" }
              - { label: "Organization & City", name: "organization", widget: "string" }
              - { label: "Duration / Experience", name: "duration", widget: "string" }
              - { label: "Role Overview (editable placeholder)", name: "overview", widget: "text" }
              - { label: "Individual Responsibilities Heading", name: "individualTitle", widget: "string" }
              - { label: "Individual Responsibilities List", name: "individualItems", widget: "list" }
              - { label: "Collaborative Work Heading", name: "collaborativeTitle", widget: "string" }
              - { label: "Collaborative Work List", name: "collaborativeItems", widget: "list" }
          - label: "Tools & Platforms Section"
            name: "tools"
            widget: "object"
            fields:
              - { label: "Section Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Section Headline", name: "headline", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Tools List (Add design, video & web tools here)"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Tool / Platform Name", name: "name", widget: "string" }
                  - { label: "Tag Size", name: "size", widget: "select", options: ["", "lg", "sm"], required: false }
          - label: "Social Reels & Shorts Slider (9:16)"
            name: "socialReels"
            widget: "object"
            fields:
              - { label: "Section Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Section Headline", name: "headline", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - label: "Video Preview Bars (9:16 Portrait)"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Project / Video Title", name: "title", widget: "string" }
                  - { label: "Platform", name: "platform", widget: "select", options: ["Instagram", "YouTube"] }
                  - { label: "Category Tag", name: "category", widget: "string", required: false }
                  - { label: "9:16 Preview Image / Thumbnail", name: "thumbnail", widget: "image" }
                  - { label: "Social Media Video Link (URL)", name: "videoUrl", widget: "string" }

      - name: "about"
        label: "About Me Page Copy"
        file: "src/data/about.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline Start", name: "headlineStart", widget: "string" }
          - { label: "Headline Accent", name: "headlineAccent", widget: "string" }
          - { label: "Header Introduction", name: "intro", widget: "text" }
          - { label: "Journey Section Heading", name: "journeyHeading", widget: "string" }
          - { label: "Journey Paragraphs", name: "journeyParagraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
          - { label: "Approach Section Heading", name: "approachHeading", widget: "string" }
          - { label: "Approach Paragraphs", name: "approachParagraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
          - { label: "Career Goals Label", name: "goalsTitle", widget: "string" }
          - { label: "Career Goals Description", name: "goalsText", widget: "text" }
          - { label: "Workflow Section Heading", name: "workflowHeading", widget: "string" }
          - { label: "Workflow Subtitle", name: "workflowSubtitle", widget: "text" }
          - label: "Workflow Steps"
            name: "workflowSteps"
            widget: "list"
            fields:
              - { label: "Step Number", name: "num", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

      - name: "navigation"
        label: "Header Navigation Links"
        file: "src/data/navigation.json"
        fields:
          - label: "Main Menu Links"
            name: "main"
            widget: "list"
            fields:
              - { label: "Link Label", name: "label", widget: "string" }
              - { label: "Destination URL", name: "href", widget: "string" }
              - label: "Submenu Items"
                name: "children"
                widget: "list"
                required: false
                fields:
                  - { label: "Submenu Label", name: "label", widget: "string" }
                  - { label: "Submenu URL", name: "href", widget: "string" }
          - label: "Call To Action Button"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Button Label", name: "label", widget: "string" }
              - { label: "Button Link", name: "href", widget: "string" }
