    <polygon points="0,0 -140,-80 -140,80 0,160" fill="#182535" stroke="rgba(255,106,0,0.4)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#FF6A00"/>
  </g>
  
  <text x="100" y="860" fill="#FF6A00" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="3">02 / 3D VISUALIZATION</text>
  <text x="100" y="900" fill="#F7F7F5" font-family="'Playfair Display', serif" font-size="32" font-weight="500">Kaia Furniture</text>
