<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <radialGradient id="cl-aperture-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FF6A00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" fill="url(#cl-bg)"/>
  <circle cx="90" cy="90" r="70" fill="url(#cl-aperture-glow)"/>

  <!-- Viewfinder Crosshairs and Frame Corners -->
  <path d="M20 30 L20 20 L30 20" fill="none" stroke="#FF6A00" stroke-width="1.5"/>
  <path d="M150 20 L160 20 L160 30" fill="none" stroke="#FF6A00" stroke-width="1.5"/>
  <path d="M20 150 L20 160 L30 160" fill="none" stroke="#FF6A00" stroke-width="1.5"/>
  <path d="M160 150 L160 160 L150 160" fill="none" stroke="#FF6A00" stroke-width="1.5"/>

  <!-- Lens Barrel Rings -->
  <circle cx="90" cy="90" r="54" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="90" cy="90" r="44" fill="none" stroke="rgba(255,106,0,0.3)" stroke-width="1" stroke-dasharray="4 2"/>
  <circle cx="90" cy="90" r="30" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="90" cy="90" r="16" fill="rgba(255,106,0,0.15)" stroke="#FFA040" stroke-width="1.5"/>

  <!-- Aperture Blades -->
  <line x1="90" y1="74" x2="104" y2="82" stroke="#FF6A00" stroke-width="1.2"/>
  <line x1="104" y1="82" x2="104" y2="98" stroke="#FF6A00" stroke-width="1.2"/>
  <line x1="104" y1="98" x2="90" y2="106" stroke="#FF6A00" stroke-width="1.2"/>
  <line x1="90" y1="106" x2="76" y2="98" stroke="#FF6A00" stroke-width="1.2"/>
  <line x1="76" y1="98" x2="76" y2="82" stroke="#FF6A00" stroke-width="1.2"/>
  <line x1="76" y1="82" x2="90" y2="74" stroke="#FF6A00" stroke-width="1.2"/>

  <!-- Studio 3-Point Light Rays -->
  <!-- Key light -->
  <line x1="34" y1="44" x2="68" y2="72" stroke="rgba(255,106,0,0.4)" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="30" cy="40" r="3" fill="#FF6A00"/>
  <text x="24" y="32" fill="#FFA040" font-family="'IBM Plex Mono', monospace" font-size="6">KEY</text>

  <!-- Rim light -->
  <line x1="146" y1="44" x2="112" y2="72" stroke="rgba(61,107,255,0.4)" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="150" cy="40" r="3" fill="#3d6bff"/>
  <text x="142" y="32" fill="#3d6bff" font-family="'IBM Plex Mono', monospace" font-size="6">RIM</text>

  <!-- Technical Specs Text -->
  <text x="44" y="165" fill="rgba(255,255,255,0.45)" font-family="'IBM Plex Mono', monospace" font-size="7" letter-spacing="0.5">85mm • f/1.4 • 5600K</text>
  <text x="90" y="16" fill="rgba(255,255,255,0.3)" font-family="'IBM Plex Mono', monospace" font-size="6.5" text-anchor="middle">OPTICAL RIG</text>
</svg>
