<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="100%" height="100%">
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="db-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d6bff"/>
      <stop offset="50%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#FFA040"/>
    </linearGradient>
    <linearGradient id="db-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="280" height="160" fill="url(#db-bg)"/>

  <!-- Top bar & KPIs -->
  <text x="18" y="24" fill="rgba(255,255,255,0.4)" font-family="'IBM Plex Mono', monospace" font-size="8" letter-spacing="1">METRICS // REVENUE</text>
  <rect x="206" y="14" width="56" height="14" rx="3" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.4)" stroke-width="0.75"/>
  <text x="212" y="24" fill="#FF6A00" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600">+340% ROAS</text>

  <!-- Big Metric Value -->
  <text x="18" y="52" fill="#F7F7F5" font-family="'Playfair Display', serif" font-size="22" font-weight="600">$184.2K</text>
  <text x="120" y="50" fill="#25D366" font-family="'IBM Plex Mono', monospace" font-size="8">↑ 4.2x conv</text>

  <!-- Chart Grid Lines -->
  <line x1="18" y1="75" x2="262" y2="75" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>
  <line x1="18" y1="105" x2="262" y2="105" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>
  <line x1="18" y1="135" x2="262" y2="135" stroke="rgba(255,255,255,0.08)" stroke-width="0.75"/>

  <!-- Mini Bar Chart in corner -->
  <rect x="220" y="90" width="6" height="45" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="230" y="75" width="6" height="60" rx="1" fill="rgba(255,255,255,0.15)"/>
  <rect x="240" y="60" width="6" height="75" rx="1" fill="rgba(255,106,0,0.4)"/>
  <rect x="250" y="45" width="6" height="90" rx="1" fill="url(#db-line)"/>

  <!-- Area Chart Fill & Line Curve -->
  <path d="M18 128 Q 50 120, 80 100 T 140 85 T 190 55 L 190 135 L 18 135 Z" fill="url(#db-fill)"/>
  <path d="M18 128 Q 50 120, 80 100 T 140 85 T 190 55" fill="none" stroke="url(#db-line)" stroke-width="2" stroke-linecap="round"/>

  <!-- Peak point pulse -->
  <circle cx="190" cy="55" r="4" fill="#FFA040"/>
  <circle cx="190" cy="55" r="8" fill="none" stroke="#FF6A00" stroke-width="1" opacity="0.6"/>

  <text x="18" y="150" fill="rgba(255,255,255,0.3)" font-family="'IBM Plex Mono', monospace" font-size="7">W1</text>
  <text x="75" y="150" fill="rgba(255,255,255,0.3)" font-family="'IBM Plex Mono', monospace" font-size="7">W2</text>
  <text x="135" y="150" fill="rgba(255,255,255,0.3)" font-family="'IBM Plex Mono', monospace" font-size="7">W3</text>
  <text x="185" y="150" fill="#FF6A00" font-family="'IBM Plex Mono', monospace" font-size="7">W4</text>
</svg>
