<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <radialGradient id="sc-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#3d6bff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sc-poly1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#993800" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sc-poly2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="sc-poly3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#383838"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="260" fill="url(#sc-bg)"/>
  <rect width="200" height="260" fill="url(#sc-glow)"/>

  <!-- 3D Coordinate Grid Floor -->
  <g opacity="0.25">
    <line x1="30" y1="210" x2="170" y2="210" stroke="#FF6A00" stroke-width="0.75"/>
    <line x1="50" y1="225" x2="150" y2="225" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
    <line x1="40" y1="200" x2="70" y2="235" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <line x1="100" y1="200" x2="100" y2="235" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <line x1="160" y1="200" x2="130" y2="235" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  </g>

  <!-- Faceted 3D Geometric Sculpture (Icosahedron / Polyhedron) -->
  <g transform="translate(100, 115)">
    <!-- Back facets -->
    <polygon points="0,-65 -48,-20 0,-10" fill="url(#sc-poly2)" stroke="rgba(255,255,255,0.12)" stroke-width="0.75"/>
    <polygon points="0,-65 48,-20 0,-10" fill="url(#sc-poly3)" stroke="rgba(255,255,255,0.15)" stroke-width="0.75"/>
    
    <!-- Mid facets -->
    <polygon points="-48,-20 -58,35 -12,48" fill="#1e1e1e" stroke="rgba(255,255,255,0.15)" stroke-width="0.75"/>
    <polygon points="-48,-20 0,-10 -12,48" fill="url(#sc-poly1)" stroke="#FF6A00" stroke-width="1"/>
    <polygon points="0,-10 48,-20 12,48" fill="#242424" stroke="rgba(255,255,255,0.2)" stroke-width="0.75"/>
    <polygon points="48,-20 58,35 12,48" fill="#181818" stroke="rgba(255,255,255,0.12)" stroke-width="0.75"/>
    
    <!-- Front focal facets (lit with orange energy) -->
    <polygon points="-12,48 0,-10 12,48" fill="url(#sc-poly1)" stroke="#FFA040" stroke-width="1.2"/>
    <polygon points="-12,48 0,72 12,48" fill="#FF6A00" stroke="#FF9030" stroke-width="1.2" opacity="0.85"/>
    <polygon points="-58,35 0,72 -12,48" fill="#1b1b1b" stroke="rgba(255,106,0,0.3)" stroke-width="0.75"/>
    <polygon points="58,35 0,72 12,48" fill="#141414" stroke="rgba(255,255,255,0.15)" stroke-width="0.75"/>

    <!-- Vertex points -->
    <circle cx="0" cy="-65" r="2.5" fill="#FFA040"/>
    <circle cx="0" cy="-10" r="2" fill="#FFFFFF"/>
    <circle cx="-48" cy="-20" r="2" fill="rgba(255,255,255,0.6)"/>
    <circle cx="48" cy="-20" r="2" fill="rgba(255,255,255,0.6)"/>
    <circle cx="-12" cy="48" r="2.5" fill="#FF6A00"/>
    <circle cx="12" cy="48" r="2.5" fill="#FF6A00"/>
    <circle cx="0" cy="72" r="3" fill="#FFA040"/>
  </g>

  <!-- Technical Overlay HUD -->
  <text x="16" y="24" fill="rgba(255,255,255,0.35)" font-family="'IBM Plex Mono', monospace" font-size="7.5" letter-spacing="1">POLYMESH // 3D</text>
  <text x="140" y="24" fill="#FF6A00" font-family="'IBM Plex Mono', monospace" font-size="7.5">14.2k V</text>
  <text x="16" y="242" fill="rgba(255,255,255,0.4)" font-family="'IBM Plex Mono', monospace" font-size="7">SUBD • QUADS • UV</text>
  <path d="M172 236 L184 236 L184 248" fill="none" stroke="rgba(255,106,0,0.5)" stroke-width="1"/>
</svg>
